services:
  - type: web
    name: seo-strategy-lab-agent
    runtime: node
    buildCommand: npm install
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://manmicheal214-maker.github.io
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
